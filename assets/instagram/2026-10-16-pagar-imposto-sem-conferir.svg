<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Card educativo para empresários: pagar imposto sem conferir não é gestão">
<rect width="1080" height="1350" fill="#10151b"/>
<rect x="0" y="0" width="1080" height="17" fill="#bb9b58"/>
<rect x="74" y="75" width="932" height="1200" rx="20" fill="none" stroke="#6b5a39" stroke-width="2"/>
<text x="125" y="166" font-family="Arial,Helvetica,sans-serif" fill="#d5b66c" font-size="36" letter-spacing="7">INTELIGÊNCIA TRIBUTÁRIA</text>
<path d="M125 217 H955" stroke="#a88c4e" stroke-width="3"/>
<text x="125" y="396" font-family="Arial,Helvetica,sans-serif" fill="#ffffff" font-size="94" font-weight="800">PAGAR IMPOSTO</text>
<text x="125" y="510" font-family="Arial,Helvetica,sans-serif" fill="#ffffff" font-size="94" font-weight="800">SEM CONFERIR</text>
<text x="125" y="624" font-family="Arial,Helvetica,sans-serif" fill="#e5c57c" font-size="94" font-weight="800">NÃO É GESTÃO.</text>
<path d="M125 720 H260" stroke="#d5b66c" stroke-width="10"/>
<text x="125" y="816" font-family="Arial,Helvetica,sans-serif" fill="#d9dde2" font-size="44">A guia chegou.</text>
<text x="125" y="882" font-family="Arial,Helvetica,sans-serif" fill="#d9dde2" font-size="44">Você sabe por que deve</text>
<text x="125" y="948" font-family="Arial,Helvetica,sans-serif" fill="#d9dde2" font-size="44">esse valor?</text>
<rect x="125" y="1051" width="830" height="2" fill="#504a3f"/>
<text x="125" y="1125" font-family="Arial,Helvetica,sans-serif" fill="#e5c57c" font-size="33" font-weight="700" letter-spacing="1">CUMPRIR A LEI. EVITAR O INDEVIDO.</text>
<text x="125" y="1202" font-family="Arial,Helvetica,sans-serif" fill="#8c949f" font-size="26">CONTEÚDO PARA EMPRESÁRIOS</text>
</svg>